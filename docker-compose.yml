version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: paytm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: seat_reservation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seat_reservation"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paytm-seat-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/seat_reservation
      JWT_SECRET: paytm-money-secret-key-at-scale-2026
      DEFAULT_PER_USER_LIMIT: 4
      DB_POOL_MAX: 30
    ports:
      - "3000:3000"

volumes:
  pgdata:
